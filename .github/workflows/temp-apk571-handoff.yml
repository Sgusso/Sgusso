name: Temp APK 572 Artifact Handoff

permissions:
  contents: read
  actions: write

on:
  push:
    branches:
      - temp-apk571-handoff
  workflow_dispatch:

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout handoff metadata
        uses: actions/checkout@v4

      - name: Download exact APK 572
        run: |
          set -euo pipefail
          URL="$(cat APK572_URL.txt)"
          curl -fL "$URL" -o SynkTruck-R49.3.5-Android572-SYN-GENERALIST-GOOGLE-GROUNDED.apk
          test "$(stat -c%s SynkTruck-R49.3.5-Android572-SYN-GENERALIST-GOOGLE-GROUNDED.apk)" -eq 70938067
          echo "aec508c4384a74b5004d301663934930167441c46ace1e3d46ac267794f3f84b  SynkTruck-R49.3.5-Android572-SYN-GENERALIST-GOOGLE-GROUNDED.apk" | sha256sum -c -

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SynkTruck-Android572-Chat-Handoff
          path: SynkTruck-R49.3.5-Android572-SYN-GENERALIST-GOOGLE-GROUNDED.apk
          retention-days: 1
          compression-level: 0
