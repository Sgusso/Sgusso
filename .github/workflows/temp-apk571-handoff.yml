name: Temp APK 574 Artifact Handoff

permissions:
  contents: read
  actions: write

on:
  push:
    branches:
      - temp-apk571-handoff
  workflow_dispatch:

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout handoff metadata
        uses: actions/checkout@v4

      - name: Download exact APK 574
        run: |
          set -euo pipefail
          URL="$(cat APK574_URL.txt)"
          curl -fL "$URL" -o SynkTruck-R49.3.5-Android574-SYN-WEATHER-STABLE-SIGNING.apk
          test "$(stat -c%s SynkTruck-R49.3.5-Android574-SYN-WEATHER-STABLE-SIGNING.apk)" -eq 70953267
          echo "4c9657c1953c51c789fbe545ee7df2eb9180cdca96671a7f900904af16eb0e8a  SynkTruck-R49.3.5-Android574-SYN-WEATHER-STABLE-SIGNING.apk" | sha256sum -c -

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SynkTruck-Android574-Chat-Handoff
          path: SynkTruck-R49.3.5-Android574-SYN-WEATHER-STABLE-SIGNING.apk
          retention-days: 1
          compression-level: 0
