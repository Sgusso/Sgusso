name: Temp APK 571 Artifact Handoff

permissions:
  contents: read
  actions: write

on:
  push:
    branches:
      - temp-apk571-handoff
  workflow_dispatch:

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact APK 571
        run: |
          set -euo pipefail
          curl -fL "https://qurl.sh/9b9fd1737e5d495f/SynkTruck-R49.3.5-Android571-SYN-GENERALIST-GROUNDED.apk" -o SynkTruck-R49.3.5-Android571-SYN-GENERALIST-GROUNDED.apk
          test "$(stat -c%s SynkTruck-R49.3.5-Android571-SYN-GENERALIST-GROUNDED.apk)" -eq 70938183
          echo "93bc8a69cc7b226549632d470433c1253ceb533b5ca7a77c43e4556bb9737114  SynkTruck-R49.3.5-Android571-SYN-GENERALIST-GROUNDED.apk" | sha256sum -c -

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SynkTruck-Android571-Chat-Handoff
          path: SynkTruck-R49.3.5-Android571-SYN-GENERALIST-GROUNDED.apk
          retention-days: 1
          compression-level: 0
