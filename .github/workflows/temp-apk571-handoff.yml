name: Temp APK 573 Google Artifact Handoff

permissions:
  contents: read
  actions: write

on:
  push:
    branches:
      - temp-apk571-handoff
  workflow_dispatch:

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout handoff metadata
        uses: actions/checkout@v4

      - name: Download exact APK 573 Google
        run: |
          set -euo pipefail
          URL="$(cat APK573_GOOGLE_URL.txt)"
          curl -fL "$URL" -o SynkTruck-R49.3.5-Android573-SYN-GENERALIST-GOOGLE-ONLINE.apk
          test "$(stat -c%s SynkTruck-R49.3.5-Android573-SYN-GENERALIST-GOOGLE-ONLINE.apk)" -eq 70952735
          echo "cf1e4ca7c7c264e94bf2ceed718ee7a274c5e782981267bf97eb38151ced9993  SynkTruck-R49.3.5-Android573-SYN-GENERALIST-GOOGLE-ONLINE.apk" | sha256sum -c -

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SynkTruck-Android573-Google-Chat-Handoff
          path: SynkTruck-R49.3.5-Android573-SYN-GENERALIST-GOOGLE-ONLINE.apk
          retention-days: 1
          compression-level: 0
