name: Temp APK 574 Artifact Handoff

permissions:
  contents: read
  actions: write

on:
  push:
    branches:
      - temp-apk571-handoff
  workflow_dispatch:

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout handoff metadata
        uses: actions/checkout@v4

      - name: Download exact APK 574
        run: |
          set -euo pipefail
          URL="$(cat APK574_URL.txt)"
          curl -fL "$URL" -o SynkTruck-R49.3.5-Android574-SYN-GENERALIST-OPEN-DATA-STABLE.apk
          test "$(stat -c%s SynkTruck-R49.3.5-Android574-SYN-GENERALIST-OPEN-DATA-STABLE.apk)" -eq 70939491
          echo "577c9d9aab87b75ffbc679517ea56b0ffd03cfff8291a791937852419ab0d90e  SynkTruck-R49.3.5-Android574-SYN-GENERALIST-OPEN-DATA-STABLE.apk" | sha256sum -c -

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SynkTruck-Android574-Chat-Handoff
          path: SynkTruck-R49.3.5-Android574-SYN-GENERALIST-OPEN-DATA-STABLE.apk
          retention-days: 1
          compression-level: 0
